name: Release
on:
  push:
    tags:
      - "v*"

# Read-only by default. The write token goes to one job that checks out no code.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Assert tag matches package.json version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg. Run 'npm run bump-version $tag' before tagging." >&2
            exit 1
          fi
      - name: Assert the tag is reachable from main or release branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_REF_NAME}" -q .status 2>/dev/null || echo "not_found")"
          case "$status" in
            identical|behind) exit 0 ;;
          esac
          rel_branch="release/${GITHUB_REF_NAME}"
          rel_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${rel_branch}...${GITHUB_REF_NAME}" -q .status 2>/dev/null || echo "not_found")"
          case "$rel_status" in
            identical|behind) exit 0 ;;
            *)
              echo "::error::$GITHUB_REF_NAME is not reachable from main (compare status: $status) or $rel_branch (compare status: $rel_status)." >&2
              exit 1
              ;;
          esac
      - name: Assert tag is signed by authorized release key
        shell: bash
        run: |
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile .github/allowed_signers
          if ! git verify-tag "$GITHUB_REF_NAME" 2>&1; then
            echo "::error::Tag $GITHUB_REF_NAME signature verification failed or signer not authorized in .github/allowed_signers." >&2
            exit 1
          fi
      - run: npm test
      - run: npm run check-version
      - run: npm pack --dry-run
      - name: Build npm package tarball
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 20
        run: npm pack
      - name: Generate SPDX 2.3 SBOM and SHA-256 Digest
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 20
        run: |
          npm sbom --sbom-format=spdx > triad-flow.spdx.json
          sha256sum triad-flow.spdx.json > triad-flow.spdx.json.sha256
      - name: Upload npm package artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 20
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: package-tarball
          path: "*.tgz"
          if-no-files-found: error
      - name: Upload SBOM artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 20
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: package-sbom
          path: |
            triad-flow.spdx.json
            triad-flow.spdx.json.sha256
          if-no-files-found: error

  publish:
    # The only job with a write token, and deliberately the only one with no
    # checkout: whoever can push a `v*` tag chooses what that tag's scripts run.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download package tarball
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: package-tarball
          path: .
      - name: Download SBOM
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: package-sbom
          path: .
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.tgz"
      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "*.tgz"
          sbom-path: "triad-flow.spdx.json"
      - name: Attest SBOM file identity
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "triad-flow.spdx.json"
      - name: Create GitHub Release and Upload Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" -q .body)"
          released_at="$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')"
          {
            printf 'Released: %s (UTC+8 台北)\n\n' "$released_at"
            printf '%s\n' "$notes"
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            *.tgz \
            triad-flow.spdx.json \
            triad-flow.spdx.json.sha256

  # Tests what a user actually installs, not the tree the workflow was handed.
  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20
      - name: Verify build provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "*.tgz"
          gh attestation verify *.tgz --repo "$GITHUB_REPOSITORY"
      - name: Verify SBOM attestation and SHA-256 byte identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "triad-flow.spdx.json*"
          sha256sum --check triad-flow.spdx.json.sha256
          gh attestation verify triad-flow.spdx.json --repo "$GITHUB_REPOSITORY"
          gh attestation verify *.tgz --repo "$GITHUB_REPOSITORY" --predicate-type https://spdx.dev/Document
      - name: Install the published tag from git and run its CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          git clone --quiet --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://github.com/${GITHUB_REPOSITORY}.git" published
          cd published
          reported="$(node -p "require('./package.json').version")"
          if [ "$reported" != "$tag" ]; then
            echo "::error::The published $GITHUB_REF_NAME reports package.json version $reported." >&2
            exit 1
          fi
          npm test
          node bin/triad-flow.mjs doctor

