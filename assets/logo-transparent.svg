<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <title>Triad-Flow Official Logo - Transparent Vector</title>
  <defs>
    <linearGradient id="tf-trans-warm" x1="30" y1="90" x2="64" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="60%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FFE55C" />
    </linearGradient>
    <linearGradient id="tf-trans-cyber" x1="64" y1="28" x2="92" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE55C" />
      <stop offset="50%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#8B5CF6" />
