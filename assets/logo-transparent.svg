    <path d="M 50 68 Q 64 48 78 68 Q 64 78 50 68 Z" stroke="#38BDF8" stroke-width="1.5" fill="#38BDF8" fill-opacity="0.12" />

    <circle cx="64" cy="28" r="5" fill="#FFE55C" />
    <circle cx="64" cy="28" r="8" stroke="#FFE55C" stroke-width="1.5" opacity="0.4" />
    <circle cx="62" cy="26" r="1.5" fill="#FFFFFF" />

    <circle cx="90" cy="88" r="5" fill="#8B5CF6" />
    <circle cx="90" cy="88" r="8" stroke="#8B5CF6" stroke-width="1.5" opacity="0.4" />
    <circle cx="88" cy="86" r="1.5" fill="#FFFFFF" />

    <circle cx="38" cy="88" r="5" fill="#00F5FF" />
